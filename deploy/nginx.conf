# Шаблон конфига Nginx для RetroGame. Скопировать в
# /etc/nginx/sites-available/retrogame.conf, заменить retrogame.example.com
# на реальный домен, включить (ln -s .../sites-enabled/) и выпустить TLS
# через certbot (см. docs/DEPLOY.md) — certbot сам допишет сюда server{}
# на 443 и редирект с 80.
#
# DEPLOY_PATH — тот же путь, что в GitHub Secrets (см. .github/workflows/ci.yml,
# job deploy) и deploy/activate-release.sh; document root всегда смотрит
# в symlink current/public, который атомарно переключается при каждом деплое.

server {
    listen 80;
    listen [::]:80;
    server_name retrogame.example.com;

    root /var/www/retrogame/current/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # предотвращает подмену PATH_INFO произвольным путём в query string
        internal;
    }

    # Любой другой .php — не отдаём (единственная точка входа — index.php).
    location ~ \.php$ {
        return 404;
    }

    location ~ ^/build/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ ^/uploads/ {
        expires 7d;
        access_log off;
    }

    client_max_body_size 20m;

    error_log /var/log/nginx/retrogame_error.log;
    access_log /var/log/nginx/retrogame_access.log;
}
