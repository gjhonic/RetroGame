# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # cookie_lifetime/gc_maxlifetime подняты с дефолтных 24 минут (php.ini
    # session.gc_maxlifetime=1440) до 2 недель — иначе сессия веб-кабинета
    # обрывается почти сразу после короткого простоя.
    session:
        cookie_lifetime: 1209600
        gc_maxlifetime: 1209600

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
